name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Explicit bash runs every step with -eo pipefail. Without it, GitHub runs
# `bash -e` with no pipefail, so `script | tee` takes tee's status and a
# failed script passes.
defaults:
  run:
    shell: bash

# The Lint job in build.yml stays. A GITHUB_TOKEN pull request starts no
# workflow, so a bot PR (branch auto-update-checksums) gets its checks from
# the Build run and the ci run that check-dependencies.yml dispatches on that
# branch. The workflow_dispatch trigger above is what lets the ci run start.
jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: make ci

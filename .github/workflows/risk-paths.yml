# PR triage (core ADR-0068, ADR-0077, ADR-0078; docs/specs/pr-triage.md): this
# caller runs on pull_request_target so the base risk list and this trusted
# caller execute. It adds 1 level label (level:L1 to level:L4) from
# .github/risk-paths.json, adds risk:high for L1 and L2, removes
# ready-for-human when the head moves after the label or CI is not green at the
# label, and writes a "would auto-merge" shadow comment on some Dependabot pull
# requests; it never merges. It checks out nothing, runs no PR code and is not a
# required check. The repository must have the risk:high label, or the job
# fails; a missing level label only gets a warning. Pinned to a full core
# commit SHA (core ADR-0021).
name: PR triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled]

permissions: {}

jobs:
  pr-triage:
    permissions:
      contents: read
      pull-requests: write
    uses: frostyard/core/.github/workflows/pr-triage.yml@981e7aeb014cbd3efee710e99a5043fcc4763446 # core#246 (frostyard/core main, 2026-11-14)

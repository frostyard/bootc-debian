name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A manual run on main releases and requests publication, so it has its own
# group and is never cancelled: a push to main must not stop it between
# creating the release and requesting publication. Push and pull request
# runs still cancel older runs of the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Checks the workflows, the shell scripts and the version pins. It is fast
  # and needs no container, so a broken pin fails here before the build.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "$SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint

      # actionlint also runs shellcheck on each run: block.
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

      - name: shellcheck
        run: shellcheck build.sh download/*.sh lib/*.sh

      - name: Check download/checksums.json
        run: |
          bash download/test-check-checksums.sh
          bash download/check-checksums.sh

  # 1 UTC minute stamp for both codename builds. Every version and the tag end
  # in it, so 1 release holds 1 build stamp (build.sh takes it as
  # BUILD_STAMP).
  stamp:
    name: Build stamp
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}

    steps:
      - name: Stamp
        id: stamp
        run: echo "stamp=$(date -u +%Y%m%d%H%M)" >>"$GITHUB_OUTPUT"

  # 1 leg for each Debian release, in parallel. The leg's container picks its
  # version marker and its Depends lists in build.sh (~deb13 for trixie,
  # ~deb14 for forky), and its job name is the required status check: keep
  # `Build (Debian Trixie)` as it is.
  build:
    name: Build (Debian ${{ matrix.title }})
    needs: stamp
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codename: [trixie, forky]
        include:
          - codename: trixie
            title: Trixie
          - codename: forky
            title: Forky
    container:
      image: debian:${{ matrix.codename }}
    env:
      HOME: "/root"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build ostree and bootc packages
        env:
          BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
        run: bash build.sh

      - name: Verify packages
        run: |
          dpkg -i dist/libostree-1-1_*.deb
          dpkg -i dist/bootc_*.deb
          ostree --version
          bootc --help

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-packages-${{ matrix.codename }}
          path: dist/*.deb

  # Only a manual run on main releases. The release's .deb assets are
  # published by frostyard/apt-publisher, the single Debian writer
  # (frostyard/core ADR-0055), to the `image` component, which only
  # Frostyard image builds enable (ADR-0059). apt-publisher then dispatches
  # `build` to frostyard/snosi once they are installable (ADR-0056).
  release:
    name: Release
    if: github.repository == 'frostyard/bootc-debian' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: write # create the release and its tag
      attestations: write # store the build provenance attestations
      id-token: write # sign the attestations with this workflow's identity
    outputs:
      tag: ${{ steps.check.outputs.tag }}

    steps:
      # lib/check-release.sh holds the release check, so the job needs the
      # repository, not only the artifacts.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: debian-packages-*
          merge-multiple: true
          path: ./dist

      # apt-publisher publishes every .deb in the release, and it routes a
      # ~debNN version only to the codename for Debian NN (core ADR-0055). The
      # release must therefore hold exactly this run's Debian 13 and Debian 14
      # amd64 builds of bootc and libostree-1-1
      # (docs/adr/0001-release-trixie-and-forky-builds-together.md): 1 package for
      # each name and codename, from 1 build stamp, with the same upstream
      # version on both codenames, and nothing else. The check, its messages and
      # its test are in lib/check-release.sh and tests/check-release-test.sh.
      - name: Check the packages
        id: check
        run: bash lib/check-release.sh dist

      # Binds each .deb to this workflow run. Verify with
      # gh attestation verify FILE --repo frostyard/bootc-debian --source-ref refs/heads/main
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb

      # gh uploads the assets to a draft and publishes it once all are
      # attached, so apt-publisher never sees a partial release. An existing
      # release fails this step instead of being changed. GitHub lists the
      # assets with `.deb13` and `.deb14` in place of `~deb13` and `~deb14`;
      # the packages inside keep their versions.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.deb --target "$GITHUB_SHA" --latest \
            --title "$TAG" \
            --notes "Debian 13 (trixie) and Debian 14 (forky) amd64 builds of main at $GITHUB_SHA. frostyard/apt-publisher publishes them to https://repository.frostyard.org/debian/ (trixie and forky, component image)."

  # Not continue-on-error: if the request fails, nothing was published and
  # the run must fail. Re-running this job alone requests the same release
  # again. apt-publisher routes a ~debNN version only to the codename for
  # Debian NN (core ADR-0055), so the ~deb13 packages go to trixie and the
  # ~deb14 packages to forky; naming both codenames makes it refuse anything
  # else in the release. The payload names no component: apt-publisher puts
  # this repository's packages in the component it is registered for, image
  # (core ADR-0059).
  request-publication:
    name: Request APT publication
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Request APT publication
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.APT_PUBLISH_TOKEN }}
          repository: frostyard/apt-publisher
          event-type: publish-deb
          client-payload: '{"repo": "${{ github.repository }}", "tag": "${{ needs.release.outputs.tag }}", "codenames": ["trixie", "forky"]}'

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Debian Trixie)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      HOME: "/root"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ostree and bootc packages
        run: bash build.sh

      - name: Verify packages
        run: |
          dpkg -i dist/libostree-1-1_*.deb
          dpkg -i dist/bootc_*.deb
          ostree --version
          bootc --help

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: dist/*.deb

  release:
    name: Publish to repository
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-packages
          path: ./dist

      - name: Publish to frostyard repo
        uses: frostyard/repogen/.github/actions/publish-to-r2@main
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: frostyardrepo
          purge-cache: "true"
          cloudflare-zone: ${{ secrets.CLOUDFLARE_ZONE }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          gpg-private-key: ${{ secrets.REPOGEN_GPG_KEY }}
          packages-dir: ./dist
          package-type: deb
          base-url: https://repository.frostyard.org

      - name: Kickoff snosi build
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.ORG_PAT }}
          repository: frostyard/snosi
          event-type: build
